<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出会いの広場 — Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./scene.ts"></script>
</head>
<body>
  <main>
    <header>
      <h1>出会いの広場</h1>
      <a href="#works">作品・技術</a>
    </header>
    <section id="scene" aria-label="出会いの広場" aria-describedby="controls" tabindex="0">
      <div class="sun" aria-hidden="true"></div>
      <div class="terrain" aria-hidden="true"></div>
      <div class="plaza" aria-hidden="true"></div>
      <div class="tree tree-left" aria-hidden="true"></div>
      <div class="tree tree-right" aria-hidden="true"></div>
      <div class="signal" aria-hidden="true"></div>
      <button id="host" class="actor" type="button" aria-label="僕に近づく">
        <span class="person" aria-hidden="true"><i class="head"></i><i class="body"></i><i class="arm"></i></span>
        <span class="speech" aria-hidden="true">やあ！</span>
      </button>
      <div class="workbench">
        <div class="desk" aria-hidden="true"></div>
        <button id="maker" class="actor" type="button" aria-label="制作中の僕に近づく" aria-haspopup="dialog">
          <span class="person" aria-hidden="true"><i class="head"></i><i class="body"></i></span>
          <span class="speech" id="maker-speech" aria-hidden="true">ちょっと見てく？</span>
        </button>
        <span class="desk-label" aria-hidden="true">作業台</span>
      </div>
      <div id="visitor" class="actor" aria-hidden="true"><span class="person"><i class="head"></i><i class="body"></i></span><span class="marker"></span></div>
    </section>
    <p id="controls">タップ・クリック・方向キーで移動</p>
    <p id="announcement" class="sr-only" role="status"></p>
    <dialog id="build-notes" aria-labelledby="build-title">
      <form method="dialog"><button type="submit" autofocus>閉じる</button></form>
      <h2 id="build-title">手を振るまで</h2>
      <p>歩いている人と「僕」の座標から距離を測る。近づいたら、CSSで手を振る。</p>
      <p>手を振り始める距離は <code>GREETING_DISTANCE</code> で決まる。</p>
      <a href="https://github.com/inuuk4i/Portfolio/blob/main/scene.ts">広場のコードを見る</a>
    </dialog>
    <section id="works">
      <h2>作品・技術</h2>
      <dl>
        <dt>出会いの広場</dt><dd>試作 · HTML / CSS / TypeScript</dd>
        <dt>Umoja</dt><dd>卒業制作の Web サービス · 制作中</dd>
        <dt>Web ゲーム</dt><dd>制作中</dd>
      </dl>
    </section>
  </main>
</body>
</html>
